# Deploy to AWS ECS via OIDC. Trigger: push to main (dev) and tag v* (prod).
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-deploy-dev
          aws-region: ${{ vars.AWS_REGION }}
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER_DEV }} \
            --service ${{ vars.ECS_SERVICE }} \
            --force-new-deployment \
            --query 'service.serviceArn' --output text
      - name: Wait for stable
        run: |
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER_DEV }} \
            --services ${{ vars.ECS_SERVICE }}

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_PROD }}:role/gha-deploy-prod
          aws-region: ${{ vars.AWS_REGION }}
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER_PROD }} \
            --service ${{ vars.ECS_SERVICE }} \
            --force-new-deployment
      - name: Wait for stable
        run: |
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER_PROD }} \
            --services ${{ vars.ECS_SERVICE }}
